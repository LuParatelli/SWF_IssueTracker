const sbGet = async (key) => {
  try {

};

const GanttChart = ({tasks}) => {
  if(!tasks.length) return <p style={{color:P.muted,fontSize:"13px"}}>Nenhuma tarefa cadastrada.</p>;
  const dates = tasks.flatMap(t=>[new Date(t.inicio),new Date(t.fim)]).filter(d=>!isNaN(d));
  if(!dates.length) return <p style={{color:P.muted,fontSize:"13px"}}>Adicione datas para ver o Gantt.</p>;
  const minDate = new Date(Math.min(...dates));
  const maxDate = new Date(Math.max(...dates));
  const totalDays = Math.max((maxDate-minDate)/(1000*60*60*24),1);
  const months = [];
  let cur = new Date(minDate.getFullYear(),minDate.getMonth(),1);
  while(cur<=maxDate){ months.push(new Date(cur)); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  return (
    <div style={{overflowX:"auto"}}>
      <div style={{minWidth:"600px",position:"relative"}}>
        <div style={{display:"flex",marginLeft:"180px",marginBottom:"8px",position:"relative",height:"16px"}}>
          {months.map((m,i)=>{
            const mStart=new Date(Math.max(m,minDate));
            const left=((mStart-minDate)/(1000*60*60*24))/totalDays*100;
            return <div key={i} style={{position:"absolute",left:left+"%",fontSize:"10px",fontWeight:600,color:P.muted,letterSpacing:"0.05em",textTransform:"uppercase",whiteSpace:"nowrap"}}>
              {m.toLocaleDateString("pt-BR",{month:"short",year:"2-digit"})}
            </div>;
          })}
        </div>
        {tasks.map(task=>{
          const start=new Date(task.inicio), end=new Date(task.fim);
          const valid=!isNaN(start)&&!isNaN(end);
          const left=valid?((start-minDate)/(1000*60*60*24))/totalDays*100:0;
          const width=valid?Math.max(((end-start)/(1000*60*60*24)+1)/totalDays*100,1):0;
          const color=STATUS_COLORS[task.status]?.dot||P.cinza;
          return (
            <div key={task.id} style={{display:"flex",alignItems:"center",marginBottom:"10px",height:"32px"}}>
              <div style={{width:"180px",flexShrink:0,fontSize:"12px",color:P.text,fontWeight:500,paddingRight:"12px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.tarefa}</div>
              <div style={{flex:1,position:"relative",height:"24px",background:P.bg,borderRadius:"4px"}}>
                {valid&&<div style={{position:"absolute",left:left+"%",width:width+"%",height:"100%",background:color+"33",borderRadius:"4px",border:"1px solid "+color+"66"}}>
                  <div style={{width:task.progresso+"%",height:"100%",background:color,borderRadius:"4px",display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:"4px"}}>
                    {task.progresso>15&&<span style={{fontSize:"10px",color:"#fff",fontWeight:700}}>{task.progresso}%</span>}
                  </div>
                </div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

function App() {
  const [ready,setReady]             = useState(false);
  const [loggedIn,setLoggedIn]       = useState(false);
  const [loginMode,setLoginMode]     = useState("visitor");
  const [loginPass,setLoginPass]     = useState("");
  const [loginError,setLoginError]   = useState(false);
  const [isEditor,setIsEditor]       = useState(false);
  const [issues,setIssues]           = useState(DEFAULT_ISSUES);
  const [milestones,setMilestones]   = useState(DEFAULT_MILESTONES);
  const [eventDates,setEventDates]   = useState(DEFAULT_EVENT_DATES);
  const [versionNum,setVersionNum]   = useState("01");
  const [cronograma,setCronograma]   = useState(DEFAULT_CRONOGRAMA);
  const [tab,setTab]                 = useState("tracker");
  const [cronCat,setCronCat]         = useState("Todas");
  const [editingMilestone,setEditingMilestone] = useState(null);
  const [editingCronId,setEditingCronId]       = useState(null);
  const [editCronData,setEditCronData]         = useState({});
  const [showNewCron,setShowNewCron]           = useState(false);
  const [newCron,setNewCron]                   = useState(emptyCron);
  const [savedMsg,setSavedMsg]       = useState(false);

  useEffect(()=>{
    (async()=>{
      const [i,m,ed,v,cr]=await Promise.all([sbGet("issues"),sbGet("milestones"),sbGet("eventDates"),sbGet("version"),sbGet("cronograma")]);
      if(i) setIssues(i); if(m) setMilestones(m); if(ed) setEventDates(ed); if(v) setVersionNum(v); if(cr) setCronograma(cr);
      setReady(true);
    })();
  },[]);

  useEffect(()=>{ if(ready) sbSet("issues",issues); },[issues,ready]);
  useEffect(()=>{ if(ready) sbSet("milestones",milestones); },[milestones,ready]);
  useEffect(()=>{ if(ready) sbSet("eventDates",eventDates); },[eventDates,ready]);
  useEffect(()=>{ if(ready) sbSet("version",versionNum); },[versionNum,ready]);
  useEffect(()=>{ if(ready) sbSet("cronograma",cronograma); },[cronograma,ready]);

  const flash = ()=>{ setSavedMsg(true); setTimeout(()=>setSavedMsg(false),2000); };

  const handleLogin = () => {
    if(loginMode==="visitor"&&loginPass===VIEW_PASSWORD){ setLoggedIn(true); setIsEditor(false); setLoginError(false); }
    else if(loginMode==="editor"&&loginPass===EDIT_PASSWORD){ setLoggedIn(true); setIsEditor(true); setLoginError(false); }
    else setLoginError(true);
  };

  const counts = useMemo(()=>{
    const c={total:issues.length}; STATUS_LIST.forEach(s=>c[s]=issues.filter(i=>i.status===s).length); return c;
  },[issues]);
  const overallProgress = useMemo(()=>!issues.length?0:Math.round((counts["Completed"]/issues.length)*100),[issues,counts]);
  const upcomingDeadlines = useMemo(()=>{
    const today=new Date(),next30=new Date(today.getTime()+30*24*60*60*1000);
    return issues.filter(i=>{const d=new Date(i.dueDate);return i.dueDate&&d>=today&&d<=next30&&i.status!=="Completed";}).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  },[issues]);
  const filteredCron = useMemo(()=>cronCat==="Todas"?cronograma:cronograma.filter(t=>t.categoria===cronCat),[cronograma,cronCat]);

  const deleteIssue = (id)    => { setIssues(p=>p.filter(i=>i.id!==id)); flash(); };
  const moveIssue   = (id, dir) => {
    setIssues(p=>{
      const idx=p.findIndex(i=>i.id===id); if(idx===-1) return p;
      if(dir==="up"&&idx===0) return p;
      if(dir==="down"&&idx===p.length-1) return p;
      const arr=[...p], swap=dir==="up"?idx-1:idx+1;
      [arr[idx],arr[swap]]=[arr[swap],arr[idx]]; return arr;
    }); flash();
  };

  const deleteCron = id=>{ setCronograma(p=>p.filter(t=>t.id!==id)); flash(); };

                <tr style={{borderBottom:"1px solid "+P.border,background:P.bg}}>

          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"14px"}}>
            <div style={{background:P.surface,border:"1px solid "+P.border,borderRadius:"12px",padding:"24px"}}>
              <p style={{color:P.muted,fontSize:"11px",fontWeight:600,margin:"0 0 12px",letterSpacing:"0.06em"}}>STATUS DISTRIBUTION</p>
              {STATUS_LIST.map(s=>{
                const val=counts[s]||0,pct=counts.total?Math.round(val/counts.total*100):0;
                return (
                  <div key={s} style={{marginBottom:"12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                        <div style={{width:"8px",height:"8px",borderRadius:"50%",background:STATUS_COLORS[s]?.dot}}/>
                        <span style={{fontSize:"12px",color:P.text,fontWeight:600}}>{s}</span>
                      </div>
                      <span style={{fontSize:"12px",color:P.muted}}>{val} ({pct}%)</span>
                    </div>
                    <div style={{background:P.border,borderRadius:"999px",height:"6px"}}>
                      <div style={{width:pct+"%",height:"100%",background:STATUS_COLORS[s]?.dot,borderRadius:"999px"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{background:P.surface,border:"1px solid "+P.border,borderRadius:"12px",padding:"24px"}}>
              <p style={{color:P.muted,fontSize:"11px",fontWeight:600,margin:"0 0 12px",letterSpacing:"0.06em"}}>UPCOMING DEADLINES (30 dias)</p>
              {upcomingDeadlines.length===0?<p style={{color:P.muted,fontSize:"13px"}}>Nenhum prazo próximo.</p>:
                <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                  {upcomingDeadlines.map(i=>(
                    <div key={i.id} style={{background:P.bg,borderRadius:"8px",padding:"10px 12px",borderLeft:"3px solid "+(STATUS_COLORS[i.status]?.dot)}}>
                      <div style={{color:P.text,fontSize:"12px",fontWeight:600}}>{i.categoria}</div>
                      <div style={{color:P.muted,fontSize:"11px",marginTop:"2px"}}>{i.descricao.slice(0,60)}…</div>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:"6px",alignItems:"center"}}>
                        <span style={{color:P.muted,fontSize:"11px"}}>📅 {fmtDate(i.dueDate)}</span>
                        <StatusPill s={i.status}/>
                      </div>
                    </div>
                  ))}
                </div>
              }
            </div>
            <div style={{background:P.surface,border:"1px solid "+P.border,borderRadius:"12px",padding:"24px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
                <p style={{color:P.muted,fontSize:"11px",fontWeight:600,margin:0,letterSpacing:"0.06em"}}>MILESTONES</p>
                {isEditor&&<button onClick={addMilestone} style={{background:P.verde,border:"none",color:"#fff",borderRadius:"6px",padding:"4px 10px",fontSize:"11px",fontWeight:600,cursor:"pointer"}}>+ Adicionar</button>}
              </div>
              <div style={{position:"relative",paddingLeft:"20px"}}>
                <div style={{position:"absolute",left:"7px",top:0,bottom:0,width:"2px",background:P.border}}/>
                {milestones.map(m=>{
                  const past=new Date(m.date)<new Date();
                  const isEditM=isEditor&&editingMilestone===m.id;
                  return (
                    <div key={m.id} style={{position:"relative",marginBottom:"16px"}}>
                      <div style={{position:"absolute",left:"-17px",top:"3px",width:"12px",height:"12px",borderRadius:"50%",background:past?P.verde:P.border,border:"2px solid "+P.surface}}/>
                      {isEditM?(
                        <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
                          <input value={m.name} onChange={e=>setMilestones(p=>p.map(x=>x.id===m.id?{...x,name:e.target.value}:x))} style={{...iSt,fontWeight:600}}/>
                          <input type="date" value={m.date} onChange={e=>setMilestones(p=>p.map(x=>x.id===m.id?{...x,date:e.target.value}:x))} style={iSt}/>
                          <div style={{display:"flex",gap:"5px",marginTop:"2px"}}>
                            <button onClick={()=>{setEditingMilestone(null);flash();}} style={{background:P.verde,border:"none",borderRadius:"5px",padding:"3px 10px",cursor:"pointer",color:"#fff",fontSize:"11px"}}>✓ OK</button>
                            <button onClick={()=>{setMilestones(p=>p.filter(x=>x.id!==m.id));flash();}} style={{background:P.coral,border:"none",borderRadius:"5px",padding:"3px 10px",cursor:"pointer",color:"#fff",fontSize:"11px"}}>Apagar</button>
                          </div>
                        </div>
                      ):(
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div>
                            <div style={{color:P.text,fontSize:"12px",fontWeight:600}}>{m.name}</div>
                            <div style={{color:past?P.muted:P.verde,fontSize:"11px",marginTop:"2px"}}>{fmtDate(m.date)}</div>
                          </div>
                          {isEditor&&<div style={{display:"flex",gap:"4px"}}>
                            <button onClick={()=>setEditingMilestone(m.id)} style={{background:"none",border:"none",cursor:"pointer",color:P.muted}}>✏️</button>
                            <button onClick={()=>{setMilestones(p=>p.filter(x=>x.id!==m.id));flash();}} style={{background:"none",border:"none",cursor:"pointer",color:P.coral}}>🗑</button>
                          </div>}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
